<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A gravity-powered search homepage.">
  <title>Google Gravity</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #d3d3d3;
      color: #202124;
      font: 14px Arial, sans-serif;
    }
    #scene { position: fixed; inset: 0; overflow: hidden; }
    .piece {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      user-select: none;
      touch-action: none;
    }
    .piece.interactive { user-select: auto; touch-action: auto; }
    .logo {
      width: min(260px, 70vw);
      height: auto;
      display: block;
      cursor: grab;
      background: #fff;
    }
    .logo:active { cursor: grabbing; }
    .search-form {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(570px, calc(100vw - 28px));
      padding: 8px 12px;
      border: 1px solid #dfe1e5;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(32,33,36,.14);
    }
    .search-form:focus-within {
      box-shadow: 0 1px 8px rgba(32,33,36,.24);
      border-color: transparent;
    }
    .magnifier {
      width: 16px; height: 16px; flex: 0 0 16px;
      border: 2px solid #9aa0a6; border-radius: 50%;
      position: relative;
    }
    .magnifier::after {
      content: ""; position: absolute; width: 6px; height: 2px;
      background: #9aa0a6; right: -5px; bottom: -2px; transform: rotate(45deg);
    }
    #q {
      width: 100%; min-width: 0; border: 0; outline: 0;
      font: 16px Arial, sans-serif; color: #202124; background: transparent;
    }
    .buttons { display: flex; gap: 8px; }
    .buttons button {
      padding: 10px 16px; border: 1px solid #dadce0;
      border-radius: 2px; background: #f8f9fa; color: #3c4043;
      font: 14px Arial, sans-serif; cursor: pointer;
    }
    .buttons button:hover { border-color: #dadce0; }
    .hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100vw - 24px);
      padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,.9); color: #5f6368;
      box-shadow: 0 1px 5px rgba(60,64,67,.12);
      font-size: 12px; text-align: center; pointer-events: none;
      transition: opacity .4s;
    }
    .hint.hidden { opacity: 0; }
    .reset {
      position: fixed; right: 12px; bottom: 12px;
      border: 1px solid #dadce0; border-radius: 20px;
      background: rgba(255,255,255,.92); color: #5f6368;
      padding: 8px 12px; cursor: pointer;
    }
    .reset:hover { background: #f8f9fa; }
    @media (prefers-reduced-motion: reduce) {
      /* The fall is short and user-triggered by page load; the simulation remains functional. */
    }
  </style>
</head>

    <form class="piece interactive search-form" id="searchForm" role="search">
      <span class="magnifier" aria-hidden="true"></span>
      <input id="q" name="q" type="search" aria-label="Search Google" autocomplete="off">
    </form>

    <div class="piece interactive buttons" id="buttons">
      <button type="submit" form="searchForm">Google Search</button>
      <button type="button" id="lucky">I'm Feeling Lucky</button>
    </div>
  </main>

  <div class="hint" id="hint">Everything falls. Search Google, or drag the pieces around.</div>
  <button class="reset" id="reset" type="button">Reset scene</button>

  <script>
    (() => {
      const scene = document.getElementById('scene');
      const pieces = [...document.querySelectorAll('.piece')];
      const hint = document.getElementById('hint');
      const form = document.getElementById('searchForm');
      const query = document.getElementById('q');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let bodies = [];
      let lastTime = 0;
      let raf = 0;
      let settledTimer;

      function setupBodies() {
        cancelAnimationFrame(raf);
        clearTimeout(settledTimer);
        const w = window.innerWidth;
        const h = window.innerHeight;
        bodies = pieces.map((el, i) => {
          const rect = el.getBoundingClientRect();
          const width = el.offsetWidth;
          const height = el.offsetHeight;
          const startX = (w - width) / 2 + (i === 2 ? 0 : 0);
          const startY = Math.max(45, h * (i === 0 ? .20 : i === 1 ? .39 : .55));
          return {
            el, w: width, h: height,
            x: Math.max(0, Math.min(w - width, startX)),
            y: startY,
            vx: (Math.random() - .5) * 100,
            vy: reducedMotion ? 0 : -80 - Math.random() * 70,
            angle: (Math.random() - .5) * 8,
            va: (Math.random() - .5) * 35,
            dragging: false, pointerId: null,
            px: 0, py: 0, oldPX: 0, oldPY: 0
          };
        });
        // Put the pieces in their starting layout before the automatic fall.
        const logo = bodies[0], search = bodies[1], buttons = bodies[2];
        logo.x = (w - logo.w) / 2; logo.y = h * .20;
        search.x = (w - search.w) / 2; search.y = h * .39;
        buttons.x = (w - buttons.w) / 2; buttons.y = h * .55;
        bodies.forEach(draw);
        lastTime = performance.now();
        raf = requestAnimationFrame(frame);
        settledTimer = setTimeout(() => hint.classList.add('hidden'), 5500);
      }

      function draw(b) {
        b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0) rotate(${b.angle}deg)`;
      }

      function frame(now) {
        const dt = Math.min(.032, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        const W = window.innerWidth, H = window.innerHeight;
        let moving = false;
        for (const b of bodies) {
          if (b.dragging) { moving = true; continue; }
          b.vy += 1500 * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.angle += b.va * dt;

          if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * .55; b.va += 8; }
          if (b.x + b.w > W) { b.x = W - b.w; b.vx = -Math.abs(b.vx) * .55; b.va -= 8; }
          if (b.y + b.h > H) {
            b.y = H - b.h;
            if (Math.abs(b.vy) > 90) {
              b.vy = -Math.abs(b.vy) * .28;
              b.vx *= .82;
              b.va *= .72;
            } else {
              b.vy = 0;
              b.va *= .94;
            }
          }
          if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy) * .4; }
          if (Math.abs(b.vx) > 1 || Math.abs(b.vy) > 1 || Math.abs(b.va) > .5) moving = true;
          draw(b);
        }
        if (moving) raf = requestAnimationFrame(frame);
        else raf = 0;
      }

      function wake() {
        if (!raf) {
          lastTime = performance.now();
          raf = requestAnimationFrame(frame);
        }
      }

      for (const b of pieces) {
        b.addEventListener('pointerdown', event => {
          if (event.target.closest('input, button')) return;
          const body = bodies.find(item => item.el === b);
          if (!body) return;
          body.dragging = true;
          body.pointerId = event.pointerId;
          body.px = event.clientX; body.py = event.clientY;
          body.oldPX = event.clientX; body.oldPY = event.clientY;
          b.setPointerCapture(event.pointerId);
          wake();
        });
        b.addEventListener('pointermove', event => {
          const body = bodies.find(item => item.el === b);
          if (!body || !body.dragging || body.pointerId !== event.pointerId) return;
          const dx = event.clientX - body.px, dy = event.clientY - body.py;
          body.x += dx; body.y += dy;
          body.vx = (event.clientX - body.oldPX) * 8;
          body.vy = (event.clientY - body.oldPY) * 8;
          body.oldPX = event.clientX; body.oldPY = event.clientY;
          body.px = event.clientX; body.py = event.clientY;
          draw(body);
        });
        const release = event => {
          const body = bodies.find(item => item.el === b);
          if (!body || !body.dragging || body.pointerId !== event.pointerId) return;
          body.dragging = false; body.pointerId = null;
          wake();
        };
        b.addEventListener('pointerup', release);
        b.addEventListener('pointercancel', release);
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const value = query.value.trim();
        if (value) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(value);
        else query.focus();
      });

      document.getElementById('lucky').addEventListener('click', () => {
        const value = query.value.trim();
        if (value) window.location.href = 'https://www.google.com/search?btnI=1&q=' + encodeURIComponent(value);
        else query.focus();
      });

      document.getElementById('reset').addEventListener('click', setupBodies);
      window.addEventListener('resize', setupBodies);
      setupBodies();
    })();
  </script>
